<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: cornflowerblue;
            color: whitesmoke;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin: 10px 0 16px;
            font-size: 40px;
            font-family: monospace;
        }

        .game {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 24px;
        }

        .left_panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .start_ui,
        .nextBox_ui,
        .game_info {
            width: 208px;
            padding: 16px;
            border: 3px solid gold;
            background-color: darkslategray;
            text-align: left;
        }

        h2 {
            margin: 0 0 16px;
            font-size: 17px;
            white-space: nowrap;
        }

        .start_ui label {
            display: block;
            margin: 8px 0;
        }

        #playfield {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            grid-auto-rows: 35px;
            border: 3px solid gold;
            background-color: black;
        }

        .cell {
            border: 1px solid darkgray;
        }
        .cell.I  { background-color: cyan; }
        .cell.O  { background-color: yellow; }
        .cell.T  { background-color: blueviolet; }
        .cell.S  { background-color: limegreen; }
        .cell.Z  { background-color: red; }
        .cell.J  { background-color: royalblue; }
        .cell.L  { background-color: darkorange; }
        .cell.I2 { background-color: deeppink; }
        .cell.U  { background-color: lightseagreen; }
        .cell.empty {border-color: transparent;}
        .cell.garbage {background-color: #555;border-color: #333;}

        .cell.BOMB {
            position: relative;
            background: radial-gradient(circle at 50% 35%, #fff9c4 0%, #ff9800 25%, #ff1744 65%, #8e0000 100%);
            border: 2px solid #fff176;
            box-shadow:
                    0 0 8px #ff1744,
                    0 0 16px #ff9100,
                    0 0 26px rgba(255, 193, 7, 0.9),
                    inset 0 0 8px #fff9c4;
            z-index: 1;
        }


        #next_piece {
            display: grid;
            min-height: 120px;
            justify-content: center;
            align-content: center;
            background-color: black;
        }

        #next_piece .cell {
            width: 24px;
            height: 24px;
        }

        .game_button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
        }

        #start_button {
            background-color: deepskyblue;
        }

        #stop_button {
            background-color: crimson;
            color: white;
        }

        #restart_button {
            background-color: gold;
        }
    </style>

    <script src="game.js" defer></script>
</head>
<body>
<h1>Welcome to Tetris</h1>

<main class="game">
    <section class="left_panel">
        <div class="start_ui">
            <h2>Chọn cấp độ chơi</h2>
            <label><input type="radio" name="level" value="1" checked> Lv1</label>
            <label><input type="radio" name="level" value="2"> Lv2</label>
            <label><input type="radio" name="level" value="3"> Lv3</label>
            <label><input type="radio" name="level" value="4"> Lv4</label>
            <label><input type="radio" name="level" value="5"> Lv5</label>
            <label><input type="radio" name="level" value="6"> Lv6</label>
        </div>

        <div class="nextBox_ui">
            <h2>Khối kế tiếp</h2>
            <div id="next_piece"></div>
        </div>
    </section>

    <div id="playfield"></div>

    <aside class="game_info">
        <h2>Thông tin</h2>
        <p>Điểm: <span id="score">0</span></p>
        <p>Hàng đã xóa: <span id="lines">0</span></p>
        <p>Cấp độ: <span id="level">1</span></p>
        <button class="game_button" id="start_button">Bắt đầu</button>
        <button class="game_button" id="stop_button">Tạm dừng</button>
        <button class="game_button" id="restart_button">Chơi lại</button>
    </aside>
</main>
</body>
</html>
